name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile || pnpm install

      - name: Build blocks-u‰ (goog to UMD)
        run: node packages/blocks-ui/build.mjs

      - name: Production build for GitHub Pages
        run: pnpm --filter @sailfish/web build
        env:
          NODE_ENV: production
          ROOT: /editor/

      - name: Copy landing page
        run: cp apps/web/index.html apps/web/build/index-landing.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
