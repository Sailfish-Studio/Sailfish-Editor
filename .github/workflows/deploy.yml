name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile || bun install
      - name: Build scratch-blocks (TS)
        run: bun run scratch-blocks/build.ts
      - name: Build scratch-gui (Vite + TS)
        run: bun --bun vite build --config scratch-gui/vite.config.ts
        env:
          NODE_ENV: production
          ROOT: /Sailfish-Studio/
      - name: Copy landing page
        run: cp index.html scratch-gui/build/index-landing.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: scratch-gui/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
