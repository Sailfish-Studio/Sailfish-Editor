name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build scratch-blocks (goog → UMD)
        run: node scratch-blocks/build-vite.js

      - name: Build (production)
        run: bun --bun vite build --config scratch-gui/vite.config.mjs
        env:
          NODE_ENV: production
          ROOT: /Sailfish-Studio/

      - name: Check build output
        run: |
          echo "Build output:"
          ls -la scratch-gui/build/ | head -20
          echo "---"
          echo "Total size:"
          du -sh scratch-gui/build/
