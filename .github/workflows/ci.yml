name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile || bun install
      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile || bun install
      - name: Build scratch-blocks (TS)
        run: bun run scratch-blocks/build.ts
      - name: Build scratch-gui (Vite + TS)
        run: bun --bun vite build --config scratch-gui/vite.config.ts
        env:
          NODE_ENV: production
          ROOT: /Sailfish-Studio/
      - name: Check build output
        run: |
          echo "Build output:"
          ls -la scratch-gui/build/ | head -20
          echo "---"
          du -sh scratch-gui/build/
