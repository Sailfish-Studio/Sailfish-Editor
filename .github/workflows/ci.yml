name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - name: Typecheck TS config files only
        run: npx tsc --noEmit apps/web/vite.config.ts apps/web/vite-plugin-webpack-compat.ts 2>&1 || true
      - name: Verify blocks-ui build exists
        run: test -f packages/blocks-ui/dist/vertical.js || (echo 'blocks-ui not built' && exit 1)

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - name: Build blocks-ui (goog → UMD)
        run: node packages/blocks-ui/build.mjs
      - name: Verify dev server starts
        run: timeout 30 pnpm dev 2>&1 | grep -q 'ready in'
      - name: Start dev server and smoke test
        run: |
          pnpm dev &
          DEV_PID=$!
          sleep 10
          curl -sf -o /dev/null -w '%%{http_code}' http://localhost:8601/editor.html
          curl -sf -o /dev/null -w '%%{http_code}' http://localhost:8601/
          kill $DEV_PID 2>/dev/null
          wait $DEV_PID 2>/dev/null || true
        env:
          PORT: 8602
          CI: true
