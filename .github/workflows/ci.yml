name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
 build-check:
    runs-on: ubuntu-latest
    env:
      BUN_VERSION: "1.1.38"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build (production)
        run: bun run build
        env:
          NODE_ENV: production
          ROOT: /Sailfish-Studio/

      - name: Check build output
        run: |
          echo "Build output:"
          ls -la scratch-gui/build/ | head -20
          echo "---"
          echo "Total size:"
          du -sh scratch-gui/build/
