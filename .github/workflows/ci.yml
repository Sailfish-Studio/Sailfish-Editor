name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - name: Build blocks-ui (goog → UMD)
        run: node packages/blocks-ui/build.mjs
      - name: Build web app (Vite)
        run: pnpm --filter @sailfish/web build
        env:
          NODE_ENV: production
          ROOT: /Sailfish-Studio/
      - name: Check build output
        run: |
          echo "Build output:"
          ls -la apps/web/build/ | head -20
          echo "---"
          du -sh apps/web/build/
